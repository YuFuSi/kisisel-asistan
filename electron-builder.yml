appId: com.kisisel.asistan
productName: Jarvis
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{CLAUDE.md,vitest.config.ts}'
  - '!scripts/*'
  - '!.claude/*'
asarUnpack:
  - resources/**
  # Konuşma algılama ve "hey jarvis" modelleri için yerel ONNX çalıştırıcısı (.node ve .dll dosyaları)
  - node_modules/onnxruntime-node/**
win:
  executableName: kisisel-asistan
copyright: Copyright © 2026 ysfll
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # Kullanıcı başına kurulum: yönetici izni istemez, %LOCALAPPDATA%\Programs altına kurar
  oneClick: true
  perMachine: false
  # Kaldırınca sohbetler, görevler ve ayarlar silinmez (%APPDATA%\kisisel-asistan)
  deleteAppDataOnUninstall: false
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# Otomatik güncelleme (electron-updater): kaynak kod gizli depoda, kurulum dosyaları ve
# latest.yml açık sürüm deposunun GitHub sürümlerinde (uygulamaya anahtar gömülmez).
# Yayın: npm run build:win → dist'teki setup.exe, .blockmap ve latest.yml bir GitHub sürümüne yüklenir.
publish:
  provider: github
  owner: YuFuSi
  repo: jarvis-releases
  releaseType: release
